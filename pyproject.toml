[project]
name = "lwyd-back"
version = "0.1.0"
description = "YouTube video/audio downloader backend"
readme = "README.md"
authors = [
    { name = "ityeri", email = "ityeri9@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dependency-injector>=4.49.1",
    "yspy>=0.2.0",
    "ydpy>=1.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.135.1",
    "pydantic>=2.12.5",
    "reger>=0.1.3",
    "starlette>=0.52.1",
    "uvicorn>=0.41.0",
    "ydpy>=1.0.0",
    "yspy>=0.2.0",
]

[project.scripts]
lwyd-back = "lwyd_back:main"

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"
